name: Development checks (not release acceptance)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --ignore-scripts && npm test
        working-directory: frontend
      - run: node --test scripts/license-files.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run synthetic browser regression (no real accounts)
        run: python tests/e2e/run.py
      - name: Verify encoded media and Range fallback with the production Player
        run: python tests/e2e/media.py
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-results
          path: docs/test-results/
          if-no-files-found: warn
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
  windows-candidate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build and run native core tests, then build Wails
        shell: powershell
        run: .\scripts\build-windows.ps1
      - name: Scan the actual executable and collect dependency notices
        shell: powershell
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/Starling.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/dependency-report.mjs build/Starling.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned development candidate (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: starling-unsigned-development-candidate
          path: |
            build/Starling.exe
            build/SHA256SUMS.txt
            desktop/go.sum
            build/compliance/
          if-no-files-found: error
  windows-installation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify installation and removal in isolated directories
        shell: powershell
        run: |
          try { .\scripts\test-installation.ps1 }
          catch {
            $detail = ($_.Exception.Message + ' ' + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Isolated installation test::$detail"
            exit 1
          }
